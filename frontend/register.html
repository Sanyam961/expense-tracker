<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Register - Expense Tracker</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="auth-page">
    <div class="auth-container">
        <h2>Register</h2>
        <form id="registerForm">
            <input type="text" id="name" placeholder="Full Name" required>
            <input type="email" id="email" placeholder="Email" required>
            <input type="password" id="password" placeholder="Password" required>
            <button type="submit">Register</button>
            <p id="errorMsg" style="color:red;"></p>
        </form>
        <p>Already have an account? <a href="login.html">Login here</a></p>
    </div>
    <script src="js/api.js"></script>
    <script>
        document.getElementById('registerForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const name = document.getElementById('name').value.trim();
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value.trim();
            document.getElementById('errorMsg').innerText = 'Loading...';
            try {
                const res = await api.register(name, email, password);
                
                if(res.user_id) {
                    window.location.href = 'login.html';
                } else {
                    document.getElementById('errorMsg').innerText = res.error || 'Registration failed';
                }
            } catch (err) {
                document.getElementById('errorMsg').innerText = 'Cannot connect to server. Ensure it is running.';
            }
        });
    </script>
</body>
</html>
