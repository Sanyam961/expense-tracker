<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login - Expense Tracker</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="auth-page">
    <div class="auth-container">
        <h2>Login</h2>
        <form id="loginForm">
            <input type="email" id="email" placeholder="Email" required>
            <input type="password" id="password" placeholder="Password" required>
            <button type="submit">Login</button>
            <p id="errorMsg" style="color:red;"></p>
        </form>
        <p>Don't have an account? <a href="register.html">Register here</a></p>
    </div>
    
    <script src="js/api.js"></script>
    <script>
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value.trim();
            document.getElementById('errorMsg').innerText = 'Loading...';
            try {
                const res = await api.login(email, password);
                
                if(res.token) {
                    localStorage.setItem('token', res.token);
                    localStorage.setItem('user', JSON.stringify(res.user));
                    window.location.href = 'index.html';
                } else {
                    document.getElementById('errorMsg').innerText = res.error || 'Login failed';
                }
            } catch (err) {
                document.getElementById('errorMsg').innerText = 'Cannot connect to server. Ensure it is running.';
            }
        });
    </script>
</body>
</html>
