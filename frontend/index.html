<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Expense Tracker</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <div class="sidebar">
        <h2>ExpenseTracker</h2>
        <ul>
            <li><a href="index.html">Dashboard</a></li>
            <li><a href="#" id="logoutBtn">Logout</a></li>
        </ul>
    </div>

    <div class="main-content">
        <header>
            <h1 id="welcomeUser">Dashboard</h1>
        </header>

        <section class="summary-cards">
            <div class="card">
                <h3>Total Expenses</h3>
                <p id="totalExpenses">$0.00</p>
            </div>
            <div class="card">
                <h3>Monthly Spending</h3>
                <p id="monthlySpending">$0.00</p>
            </div>
            <!-- Alert simple notification -->
            <div class="card" id="budgetAlert" style="display:none; color: red;">
                <h3>Alert</h3>
                <p>Budget Exceeded!</p>
            </div>
        </section>

        <section class="charts-section">
            <div class="chart-container">
                <canvas id="categoryChart"></canvas>
            </div>
        </section>

        <section class="add-expense-section">
            <h2>Add Expense</h2>
            <form id="expenseForm">
                <input type="number" id="amount" placeholder="Amount" required step="0.01">
                <select id="category" required>
                    <!-- Categories loaded dynamically -->
                </select>
                <input type="date" id="date" required>
                <input type="text" id="description" placeholder="Description">
                <button type="submit">Add Expense</button>
            </form>
        </section>

        <section class="expenses-table-section">
            <h2>Recent Expenses</h2>
            <table id="expensesTable">
                <thead>
                    <tr>
                        <th>Date</th>
                        <th>Category</th>
                        <th>Description</th>
                        <th>Amount</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody>
                    <!-- Expenses loaded here -->
                </tbody>
            </table>
        </section>
    </div>

    <script src="js/api.js"></script>
    <script src="js/dashboard.js"></script>
</body>
</html>
